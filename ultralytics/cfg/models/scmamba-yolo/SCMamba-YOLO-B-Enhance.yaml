nc: 80  # number of classes
scales:   # [depth, width, max_channels]
  B: [0.33, 0.50, 1024]  # Mamba-YOLOv8-B summary:   21.8M parameters,  49.7 GFLOPs

# SCMamba-YOLO backbone with enhancement front-end and edge-guided VSS blocks
backbone:
  # [from, repeats, module, args]
  - [-1, 1, EnhanceFront, [3, 16]]       # 0 enhancement front-end, output stays RGB
  - [-1, 1, SimpleStem, [128, 3]]         # 1-P2/4
  - [-1, 3, EGVSSBlock, [128]]            # 2
  - [-1, 1, VisionClueMerge, [256]]       # 3 p3/8
  - [-1, 3, EGVSSBlock, [256]]            # 4
  - [-1, 1, VisionClueMerge, [512]]       # 5 p4/16
  - [-1, 9, EGVSSBlock, [512]]            # 6
  - [-1, 1, VisionClueMerge, [1024]]      # 7 p5/32
  - [-1, 3, EGVSSBlock, [1024]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9

# Official SCMamba-YOLO PAFPN head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4
  - [-1, 3, XSSBlock, [512]]  # 12

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 3, XSSBlock, [256]]  # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]  # cat head P4
  - [-1, 3, XSSBlock, [512]]  # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]  # cat head P5
  - [-1, 3, XSSBlock, [1024]]  # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5)
